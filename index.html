<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Egem 🤍</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#fff0f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    .box{
      background:white;
      padding:20px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.15);
      text-align:center;
      max-width:400px;
      width:100%;
    }
    img{
      width:100%;
      border-radius:14px;
      margin:10px 0;
    }
    button{
      padding:12px 16px;
      border:none;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Egem 🤍</h1>
    <img src="photo.jpg" alt="Petek">
    <p>Seni yerim.</p>
    <p><b>Seni, senin Beşiktaş'ı sevdiğinden daha çok seviyorum</b></p>

    <button onclick="playMusic()">Müziği Aç</button>

    <p id="mesaj" style="display:none; font-size:22px; font-weight:bold; margin-top:15px;">
      seni yerim
    </p>

    <audio id="music" src="song.mp3"></audio>
  </div>

  <script>
    let ilkKez = true;

    function playMusic(){
      document.getElementById("music").play();

      if (ilkKez) {
        document.getElementById("mesaj").style.display = "block";
        ilkKez = false;
      }
    }
  </script>
</body>
</html>
