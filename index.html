<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Egem 🤍</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#fff0f5;
      font-family: Arial, Helvetica, sans-serif;
      padding:24px;
      box-sizing:border-box;
    }
    *{ box-sizing:border-box; }

    .box{
      background:white;
      padding:20px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.15);
      text-align:center;
      max-width:400px;
      width:100%;
      position:relative;
      z-index:2;
    }
    img{
      width:100%;
      border-radius:14px;
      margin:10px 0;
      display:block;
    }
    button{
      padding:12px 16px;
      border:none;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      background:#e9eefb;
    }

    /* 🔥 Mesaj */
    #mesaj{
      display:none;
      margin-top:16px;
      font-size:22px;
      font-weight:800;
      line-height:1.2;
      animation: fadeIn .35s ease forwards;
    }
    @keyframes fadeIn{
      from{ opacity:0; transform: translateY(6px); }
      to{ opacity:1; transform: translateY(0); }
    }

    /* ❤️ KALP ANİMASYONU */
    #hearts{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:1;
    }
    .heart{
      position:absolute;
      bottom:-20px;
      font-size:24px;
      animation: floatUp 3s linear forwards;
    }
    @keyframes floatUp{
      0%{ transform:translateY(0) scale(1); opacity:1; }
      100%{ transform:translateY(-100vh) scale(1.8); opacity:0; }
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Egem 🤍</h1>

    <img src="photo.jpg" alt="Petek">

    <p>Seni çok seviyorum.</p>
    <p><b>seni yerim😙</b></p>

    <button id="btn" onclick="playMusic()">Müziği Aç</button>

    <p id="mesaj">
      Seni, senin Beşiktaş’ı sevdiğinden daha çok seviyorum
    </p>

    <audio id="music" src="song.mp3"></audio>
  </div>

  <!-- ❤️ Kalpler buradan çıkacak -->
  <div id="hearts"></div>

  <script>
    let ilkKez = true;

    function playMusic(){
      const music = document.getElementById("music");
      const mesaj = document.getElementById("mesaj");
      const btn = document.getElementById("btn");

      music.play();

      if (ilkKez) {
        mesaj.style.display = "block";
        btn.textContent = "Müzik Açıldı ✅";
        createHearts();
        ilkKez = false;
      }
    }

    function createHearts(){
      const container = document.getElementById("hearts");

      for(let i=0;i<20;i++){
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "❤️";
        heart.style.left = Math.random()*100 + "vw";
        heart.style.fontSize = (20 + Math.random()*20) + "px";
        heart.style.animationDelay = Math.random() + "s";

        container.appendChild(heart);

        setTimeout(()=>heart.remove(),3000);
      }
    }
  </script>
</body>
</html>
