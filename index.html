<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Egem 🤍</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#fff0f5;
      font-family: Arial, Helvetica, sans-serif;
      padding:24px;
      box-sizing:border-box;
    }
    *{ box-sizing:border-box; }

    .box{
      background:white;
      padding:20px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.15);
      text-align:center;
      max-width:400px;
      width:100%;
    }
    img{
      width:100%;
      border-radius:14px;
      margin:10px 0;
      display:block;
    }
    button{
      padding:12px 16px;
      border:none;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      background:#e9eefb;
    }

    /* 🔥 Mesajın düzgün görünmesi için */
    #mesaj{
      display:none;
      margin-top:16px;
      font-size:22px;
      font-weight:800;
      line-height:1.2;
      word-break:break-word;
      white-space:normal;
      animation: fadeIn .35s ease forwards;
    }
    @keyframes fadeIn{
      from{ opacity:0; transform: translateY(6px); }
      to{ opacity:1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Egem 🤍</h1>

    <img src="photo.jpg" alt="Petek">

    <p>Seni yerim.</p>
    <p><b>seni yerim😙 </b></p>

    <button id="btn" onclick="playMusic()">Müziği Aç</button>

    <!-- ✅ Mesaj MUTLAKA box'ın içinde olmalı -->
    <p id="mesaj">Seni, senin beşiktaşı sevdiğinden daha çok seviyorum </p>

    <audio id="music" src="song.mp3"></audio>
  </div>

  <script>
    let ilkKez = true;

    function playMusic(){
      const music = document.getElementById("music");
      const mesaj = document.getElementById("mesaj");
      const btn = document.getElementById("btn");

      music.play();

      if (ilkKez) {
        mesaj.style.display = "block";
        btn.textContent = "Müzik Açıldı ✅";
        ilkKez = false;
      }
    }
  </script>
</body>
</html>
